name: gvhmr
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - pip
  - python=3.10
  - pytorch=2.3.1
  - pytorch-cuda=12.1
  - torchvision=0.18
  - pip:
    - tqdm
    - opencv-python
    - timm==0.9.12
    - lightning==2.3.0
    - hydra-core==1.3
    - hydra-zen
    - hydra_colorlog
    - rich
    - numpy==1.23.5
    - jupyter
    - matplotlib
    - ipdb
    - setuptools>=68.0
    - black
    - tensorboardX
    - ffmpeg-python
    - scikit-image
    - termcolor
    - einops
    - imageio==2.34.1
    - av
    - joblib
    - pytorch3d @ https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt230/pytorch3d-0.7.6-cp310-cp310-linux_x86_64.whl
    - trimesh
    - chumpy
    - smplx
    - wis3d
